[project]
name = "csmap-qgis-plugin"
version = "0.0.1"
description = ""
authors = [
    {name = "MIERUNE Inc.", email = "info@mierune.co.jp"},
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "rasterio>=1.3.10",
]

[dependency-groups]
dev = [
    "ruff>=0.4.5",
    "bandit[toml]>=1.8.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["csmap_py"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "csmap_py"]

[tool.uv]
exclude-newer = "1 week"
