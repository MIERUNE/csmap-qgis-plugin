name: export_plugin
on:
  release:
    types: [published]

env:
  PLUGIN_NAME: csmap-qgis-plugin
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Create Plugin Directory
        run: |
          mkdir ${{env.PLUGIN_NAME}}
          find . -type f | grep -ve './.git' \
            -ve '.github' \
            -ve './.vscode' \
            -ve '__pycache__/' \
            -ve './tests' \
            -ve './conftest.py' \
            -ve './pyproject.toml' \
            -ve './.gitignore' \
            -ve './.python-version' \
            -ve './README.md' \
            -ve './uv.lock' \
            -ve '^\./csmap_py/doc/' \
            -ve '\.ts$' \
            -ve '\.pro$' \
            -ve '^\./imgs/usage_.*\.png$' | xargs -I src cp --parents src ${{env.PLUGIN_NAME}}

      - name: Write version to metadata.txt
        run: |
          VERSION=${{ github.event.release.tag_name }}
          sed -i "s/^version=.*/version=$VERSION/" ${{env.PLUGIN_NAME}}/metadata.txt
          cat ${{env.PLUGIN_NAME}}/metadata.txt

      - name: Create Archive
        run: |
          zip -r ${{env.PLUGIN_NAME}}.zip ./${{env.PLUGIN_NAME}}
      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} ${{env.PLUGIN_NAME}}.zip#${{env.PLUGIN_NAME}} --clobber

      - name: Upload to plugins.qgis.org
        if: ${{ !github.event.release.prerelease }}
        env:
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        run: |
          HTTP_CODE=$(curl --silent --show-error \
            --output response.txt --write-out '%{http_code}' \
            --connect-timeout 15 --max-time 300 \
            -X POST \
            "https://plugins.qgis.org/plugins/api/${{env.PLUGIN_NAME}}/version/add/" \
            -H "Authorization: Bearer $QGIS_PLUGIN_TOKEN" \
            -F "package=@${{env.PLUGIN_NAME}}.zip")
          cat response.txt
          case "$HTTP_CODE" in
            2??) ;;
            *)
              echo "::error::plugins.qgis.org rejected the upload (HTTP $HTTP_CODE)"
              exit 1
              ;;
          esac
