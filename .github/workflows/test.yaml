name: Test plugin

on:
  pull_request:
    branches:
      - main

env:
  # Docker settings
  DOCKER_IMAGE: qgis/qgis

jobs:
  Test-plugin:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        docker_tags: ["release-3_32", "3.44", "4.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Docker pull QGIS
        run: |
          docker pull "$DOCKER_IMAGE":${{ matrix.docker_tags }}

      - name: Run tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/plugin \
            -w /plugin \
            "$DOCKER_IMAGE":${{ matrix.docker_tags }} \
            sh -c "
              (pip3 install --break-system-packages rasterio pytest pytest-qgis ||
               pip3 install rasterio pytest pytest-qgis) &&
              (command -v xvfb-run >/dev/null || (apt-get update && apt-get install -y xvfb)) &&
              xvfb-run -s '+extension GLX -screen 0 1024x768x24' \
                python3 -m pytest tests/ -v
            "
